
<!-- ==========================================
     GERENCIAMENTO DE AGENDAMENTOS
========================================== -->

<section class="lista secao-agendamentos-admin">

    <div class="agendamentos-cabecalho">
        <div>
            <h2>Solicitações de visitas</h2>
            <p>
                Gerencie os agendamentos realizados
                pelos clientes.
            </p>
        </div>

        <button
            type="button"
            id="atualizarAgendamentos"
            class="btn-atualizar-agendamentos"
        >
            Atualizar lista
        </button>
    </div>

    <div class="agendamentos-filtros">
        <label for="filtroStatusAgendamento">
            Filtrar por status:
        </label>

        <select id="filtroStatusAgendamento">
            <option value="todos">Todos</option>
            <option value="pendente">Pendentes</option>
            <option value="confirmado">Confirmados</option>
            <option value="recusado">Recusados</option>
            <option value="cancelado">Cancelados</option>
        </select>
    </div>

    <p
        id="mensagemAgendamentos"
        class="mensagem-agendamentos"
        role="status"
        aria-live="polite"
    ></p>

    <div id="listaAgendamentosAdmin">
        <p>Carregando agendamentos...</p>
    </div>

</section>
